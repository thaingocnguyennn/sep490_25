# Render Blueprint Configuration
# Deploy this service to Render using: render-blueprints apply
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dms-backend
    runtime: node
    region: singapore  # Closest to Vietnam, change if needed
    plan: free  # Use 'starter' or 'standard' for production

    # Build settings
    buildCommand: npm run build
    healthCheckPath: /health

    # Static files are served from Express, no separate static serving needed
    numInstances: 1

    # Environment variables (set these in Render Dashboard for security)
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set in Render Dashboard
      - key: JWT_SECRET
        sync: false  # Generate and set in Render Dashboard
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app  # Update after frontend deployment
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: DMS
      - key: SMTP_FROM
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: "30"
      - key: OCR_LANGS
        value: vie+eng
