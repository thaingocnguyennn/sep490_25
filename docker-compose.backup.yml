services:
  postgres:
    image: postgres:16-alpine
    container_name: dms_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: loploplop
      POSTGRES_DB: dms_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: dms_pgdata
